<section class="form-container">
  <h1>{{ id ? 'Edit' : 'Add' }} dish</h1>
  @if (error()) {
    <p role="alert" class="error">{{ error() }}</p>
  }
  @if (loading()) {
    <p>Loading…</p>
  }
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label for="name">Name</label><input id="name" formControlName="name" maxlength="100" />
    </div>
    <div class="form-group">
      <label for="description">Description</label
      ><textarea id="description" formControlName="description" maxlength="500"></textarea>
    </div>
    <div class="form-group">
      <label for="price">Price</label
      ><input id="price" type="number" min="0.01" step="0.01" formControlName="price" />
    </div>
    <div class="form-group">
      <label for="category">Category</label
      ><select id="category" formControlName="categoryId">
        <option [ngValue]="0">Choose a category</option>
        @for (category of categories(); track category.id) {
          <option [ngValue]="category.id">{{ category.name }}</option>
        }
      </select>
    </div>
    @if (!categories().length) {
      <p>Create a category first in <a routerLink="/categories/new">Categories</a>.</p>
    }
    <label class="checkbox"><input type="checkbox" formControlName="available" /> Available</label>
    @if (form.invalid && form.touched) {
      <p class="error">
        Enter a name, a positive price with at most two decimal places, and a category.
      </p>
    }
    <div class="actions">
      <button class="btn" type="submit" [disabled]="busy() || loading() || form.disabled">
        {{ busy() ? 'Saving…' : 'Save' }}</button
      ><a routerLink="/dishes">Cancel</a>
    </div>
  </form>
</section>
