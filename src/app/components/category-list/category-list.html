<section>
  <div class="heading">
    <h1>Categories</h1>
    <a class="btn" routerLink="/categories/new">Add category</a>
  </div>
  @if (error()) {
    <p role="alert" class="error">{{ error() }}</p>
    <button (click)="load()">Retry</button>
  }
  @if (loading()) {
    <p>Loading…</p>
  } @else {
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (item of records(); track item.id) {
            <tr>
              <td>{{ item.name }}</td>
              <td class="actions">
                <a [routerLink]="['/categories/edit', item.id]">Edit</a
                ><button class="danger" [disabled]="busy()" (click)="remove(item.id)">
                  Delete
                </button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5">No categories yet.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</section>
