apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "restaurant-frontend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "restaurant-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "restaurant-frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "restaurant-frontend.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 80
          env:
            - name: MENU_SERVICE_URL
              value: {{ .Values.backends.menuUrl | quote }}
            - name: ORDER_SERVICE_URL
              value: {{ .Values.backends.orderUrl | quote }}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
