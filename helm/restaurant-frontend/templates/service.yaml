apiVersion: v1
kind: Service
metadata:
  name: {{ include "restaurant-frontend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "restaurant-frontend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "restaurant-frontend.selectorLabels" . | nindent 4 }}
